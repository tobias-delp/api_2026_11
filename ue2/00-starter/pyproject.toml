[project]
name = "todo-api-ue2"
version = "1.0.0"
requires-python = ">=3.12"
dependencies = ["fastapi[standard]>=0.115,<1", "pydantic>=2.10,<3"]
[dependency-groups]
dev = [
    "httpx>=0.27,<1",
    "pytest>=8,<10",
    "pytest-playwright>=0.7,<1",
]
[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
